# GitHub's own clock. Public repo, so the minutes are free and the scheduled run is not
# capped by a plan quota.
#
# CADENCE IS 15 MINUTES, NOT 5, AND THE REASON IS OBSERVED, NOT ASSUMED. At
# */5 * * * * this workflow logged zero schedule-triggered runs in four hours while every
# push and workflow_dispatch run on the same file succeeded - GitHub documents schedules as
# best-effort, and a request for 288 runs a day is the first thing a best-effort scheduler
# drops. Whether */15 actually fires is still being measured; until it does, treat the
# cadence as unconfirmed and use "Run workflow" for a pass you can see happen.
#
# Slower polling does not cost signal fidelity here, because intraday_mr returns a STATE,
# not a one-bar event: z beyond dev_k, RSI(2) still under 20, hourly trend still intact,
# still inside the session window. Those conditions survive for many consecutive bars, so a
# pass 15 minutes late still finds the flush in progress. What a 15-minute cadence costs is
# up to 15 minutes of price - which is why every ticket prints its own signal-bar age
# instead of pretending the entry is fresh.
name: live-5m-monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["state/**"]        # otherwise a state commit would re-trigger this job

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false            # never kill a pass halfway: it may have just opened

jobs:
  scan:
    if: github.repository == 'Humphreymboya/Market-Monitor'
    runs-on: ubuntu-latest
    timeout-minutes: 8          # fetch_live retries four times with backoff per pair; 4 was
                                # close enough to the edge that a bad Yahoo minute could kill
                                # the run after an alert but before the book was committed
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: scan and alert
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ACCOUNT: ${{ vars.ACCOUNT || '10000' }}
          RISK_PCT: ${{ vars.RISK_PCT || '0.5' }}
          WATCH_TOP: ${{ vars.WATCH_TOP || '3' }}
        run: python -m lab.monitor

      - name: commit the position book so the next run inherits it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # checkout's default remote is unauthenticated https, so a plain `git push`
          # fails the moment there is something to commit - which is exactly the first
          # trade. A run that alerts and then loses its own book alerts the same setup
          # again on the next pass, so the credential goes on the remote before the push.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull --rebase --autostash origin main
          if ! git diff --quiet -- state/; then
            git add state/
            git commit -m "state: positions after scan [skip ci]"
            git push origin main
          fi
